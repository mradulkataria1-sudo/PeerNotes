{% extends "base.html" %}
{% block title %}Sign up · PeerNotes{% endblock %}
{% block content %}
<div class="auth-box">
  <h1>Create your account</h1>
  <form method="post">{% csrf_token %}
    {% include "notes/_form_fields.html" %}
    <button class="btn btn-ink w-100 mt-2" type="submit">Sign up</button>
  </form>
  <p class="mt-3 mb-0 small">Already registered? <a href="{% url 'login' %}">Log in</a>.</p>
</div>
{% endblock %}
