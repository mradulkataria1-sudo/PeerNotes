{% extends "base.html" %}
{% block title %}Log in · PeerNotes{% endblock %}
{% block content %}
<div class="auth-box">
  <h1>Log in</h1>
  <form method="post">{% csrf_token %}
    {% include "notes/_form_fields.html" %}
    <button class="btn btn-ink w-100 mt-2" type="submit">Log in</button>
  </form>
  <p class="mt-3 mb-0 small">New here? <a href="{% url 'signup' %}">Create an account</a>.</p>
</div>
{% endblock %}
